# Fit config for Compressed_FullRegions_2RISRBins_AnalysisConfig
#
# Ch 1 (SVonly):      shape_transfer  — anchor SVonly_AnchorCR predicts SVonly_SR
# Ch 2 (DelPho):      ABCD_fit        — 4-cell timing x BH-score, 2-bin RISR [0.6, 0.75) and >= 0.75
# Ch 3 (Eq2Pho):      shape_transfer  — Eq2Pho_MedIsoCR predicts Eq2Pho_TightIsoSR
# Ch 4 (MixDel):      shape_transfer  — MixDel_AnchorCR predicts MixDel_SR
# Ch 5 (MixPrompt):   shape_transfer  — MixPrompt_CR predicts MixPromptSV_SR
#
# ABCD grid convention (Ch 2):
#   notBH    D (early) | A (late) = SR
#            -------------------------
#   BH       C (early) | B (late)
#   such that A = B*C/D

fitname: "LittleGuy_Compressed_FullRegions_v52"
asimov: True
datadriven: True

# ── Shape transfer: Ch 1, Ch 3, Ch 4, Ch 5 ────────────────────────────────────────

shape_transfer_fit:
  bin_association:
    # Ch 1 — anchor CR
    SVonly_AnchorCR:
      - "SVonly_AnchorCR00"
      - "SVonly_AnchorCR10"
      - "SVonly_AnchorCR20"
    # Ch 1 — SR (CR00 is the buoy anchor bin)
    SVonly_SR:
      - "SVonly_CR00"
      - "SVonly_SR10"
      - "SVonly_SR20"

    # Ch 3 — CR (medium iso)
    Eq2Pho_MedIsoCR:
      - "Eq2Pho_MedIsoCR00"
      - "Eq2Pho_MedIsoCR10"
      - "Eq2Pho_MedIsoCR20"
      - "Eq2Pho_MedIsoCR30"
    # Ch 3 — SR (CR00 is the buoy anchor bin)
    Eq2Pho_TightIsoSR:
      - "Eq2Pho_TightIsoCR00"
      - "Eq2Pho_TightIsoSR10"
      - "Eq2Pho_TightIsoSR20"
      - "Eq2Pho_TightIsoSR30"

    # Ch 5 — CR
    MixPrompt_AnchorCR:
      - "MixPrompt_AnchorCR00"
      - "MixPrompt_AnchorCR10"
      - "MixPrompt_AnchorCR20"
    # Ch 5 — SR (CR00 is the buoy anchor bin)
    MixPrompt_SR:
      - "MixPrompt_CR00"
      - "MixPrompt_SR10"
      - "MixPrompt_SR20"
    # Ch 4 — CR
    MixDel_AnchorCR:
      - "MixDel_AnchorCR00"
      - "MixDel_AnchorCR10"
      - "MixDel_AnchorCR20"
    # Ch 4 — SR (CR00 is the buoy anchor bin)
    MixDel_SR:
      - "MixDel_CR00"
      - "MixDel_SR10"
      - "MixDel_SR20"
    DelPho_BHLateCR:
      - "DelPho_BHLateCR00"
      - "DelPho_BHLateCR10"
      - "DelPho_BHLateCR20"
    DelPho_NotBHLateSR:
      - "DelPho_NotBHLateSR00"
      - "DelPho_NotBHLateSR10"
      - "DelPho_NotBHLateSR20"

  channel_association:
    SVonly_AnchorCR:
      - "SVonly_SR"
    Eq2Pho_MedIsoCR:
      - "Eq2Pho_TightIsoSR"
    MixPrompt_AnchorCR:
      - "MixPrompt_SR"
    MixDel_AnchorCR:
      - "MixDel_SR"
    DelPho_BHLateCR:
      DelPho_NotBHLateSR: 9.8 

# ── ABCD: Ch 2 ──────────────────────────────────────────────────────
### need SR/CR in channel names because they need to match the bin names since thats how the CombineHarvester categories are built
ABCD_fit:
  bin_association:
    # Ch 2 — delayed photon (2 RISR bins per cell)
    DelPho_NotBHLateSR:
      - "DelPho_NotBHLateSR00"
      - "DelPho_NotBHLateSR10"
      - "DelPho_NotBHLateSR20"
    DelPho_MedIsoEarlyCR:
      - "DelPho_MedIsoEarlyCR00"
      - "DelPho_MedIsoEarlyCR10"
      - "DelPho_MedIsoEarlyCR20"
    DelPho_MedIsoLateCR:
      - "DelPho_MedIsoLateCR00"
      - "DelPho_MedIsoLateCR10"
      - "DelPho_MedIsoLateCR20"
    DelPho_TightIsoEarlyCR:
      - "DelPho_TightIsoEarlyCR00"
      - "DelPho_TightIsoEarlyCR10"
      - "DelPho_TightIsoEarlyCR20"

  channel_association:
    # A = B*C/D: SR (notBH late) predicted by [BH late, notBH early, BH early]
    DelPho_NotBHLateSR:
      bkgprompt:
        - "DelPho_MedIsoLateCR"
        - "DelPho_TightIsoEarlyCR"
        - "DelPho_MedIsoEarlyCR"

  # Prompt bkg leaking into the notBH early CR, templated bin-by-bin from the tight-iso early CR.
  # transfer_factor: auto = min over bins of yield(target)/yield(source), or give a number.
  #template_processes:
  #  - source_channel: "DelPho_TightIsoEarlyCR"
  #    target_channel: "DelPho_NotBHEarlyCR"
  #    process: "bkgprompt"
  #    transfer_factor: auto

