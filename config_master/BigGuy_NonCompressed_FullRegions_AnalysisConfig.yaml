analysis:
  name: "BigGuy_NonCompressed_FullRegions"
  luminosity: 423.71
  output_json: "BigGuy_NonCompressed_FullRegions_v52.json"

samples:
  signals: ["gogoGZ"]
  data: ["MET16","MET17","MET18","MET22", "MET23","MET24","MET25"]

baseline_cuts: &baseline_cuts
  - "(selCMet > 150)"

Cleaning: &Cleaning
  - "((Flag_MetFilters == 1) && (rjrPTS[0] < 200) && ((Trigger_PFMET120_PFMHT120_IDTight == 1)||(Trigger_PFMET120_PFMHT120_IDTight_PFHT60 == 1)||(Trigger_PFMETNoMu120_PFMHTNoMu120_IDTight)||(Trigger_PFMETNoMu120_PFMHTNoMu120_IDTight_PFHT60)) && (!Flag_hemVeto))"

kin: &kin
  - "((rjr_Ms[0] >= 2000) && (rjr_Rs[0] >= 0.15))"



################################################################################################################################################################################################################################################################################################
############### SV REGIONS ###############
################################################################################################################################################################################################################################################################################################


#highest priority - leptonic SV
SVgeLep1_SR: &SVgeLep1_SR
  - "(passNLepGe1SelectionHighDxySigSR == 1)"

SVgeLep1_CR: &SVgeLep1_CR
  - "(passNLepGe1SelectionLowDxySigCR == 1)"

#second priority - hadronic SV
SVgeHad1_SR: &SVgeHad1_SR
  - "(passNHadGe1SelectionHighDxySigSR == 1)"

SVgeHad1_CR: &SVgeHad1_CR
  - "(passNHadGe1SelectionLowDxySigCR == 1)"


################################ Ge1Lep Kinematic Bins (2 Ms x 2 Rs = 4 bins) ################################

bLep00: &bLep00
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.3))"
bLep10: &bLep10
  - "((rjr_Ms[0] >= 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.3))"
bLep01: &bLep01
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.3))"
bLep11: &bLep11
  - "((rjr_Ms[0] >= 2600) && (rjr_Rs[0] >= 0.3))"

################################ Ge1Had Kinematic Bins (2 low-Rs + 3 high-Rs = 5 bins) ################################

bHad00: &bHad00
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.35))"
bHad10: &bHad10
  - "((rjr_Ms[0] >= 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.35))"
bHad01: &bHad01
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.35))"
bHad11: &bHad11
  - "((rjr_Ms[0] >= 2600) && (rjr_Ms[0] < 3000) && (rjr_Rs[0] >= 0.35))"
bHad21: &bHad21
  - "((rjr_Ms[0] >= 3000) && (rjr_Rs[0] >= 0.35))"

DelayedBin00: &DelayedBin00
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.35))"
DelayedBin10: &DelayedBin10
  - "((rjr_Ms[0] >= 2600) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.35))"
DelayedBin01: &DelayedBin01
  - "((rjr_Ms[0] >= 2000) && (rjr_Ms[0] < 2600) && (rjr_Rs[0] >= 0.35))"
DelayedBin11: &DelayedBin11
  - "((rjr_Ms[0] >= 2600) && (rjr_Rs[0] >= 0.35))"
    #DelayedBin00: &DelayedBin00
    #  - "(rjr_Ms[0] >= 2000)"
    #  - "(rjr_Rs[0] >= 0.3)"

SVDelayedBin00: &SVDelayedBin00
  - "((rjr_Ms[0] >= 2000) && (rjr_Rs[0] >= 0.15) && (rjr_Rs[0] < 0.3))"
SVDelayedBin01: &SVDelayedBin01
  - "((rjr_Ms[0] >= 2000) && (rjr_Rs[0] >= 0.3))"

eq2b00: &eq2b00
  - "((rjr_Ms[0] >= 2500) && (rjr_Ms[0] < 2700) && (rjr_Rs[0] < 0.3))"
eq2b10: &eq2b10
  - "((rjr_Ms[0] >= 2700) && (rjr_Rs[0] < 0.3))"
eq2b01: &eq2b01
  - "((rjr_Ms[0] >= 2500) && (rjr_Ms[0] < 2700) && (rjr_Rs[0] >= 0.3))"
eq2b11: &eq2b11
  - "((rjr_Ms[0] >= 2700) && (rjr_Rs[0] >= 0.3))"

eq1b00: &eq1b00
  - "((rjr_Ms[0] >= 2500) && (rjr_Ms[0] < 2700) && (rjr_Rs[0] < 0.35))"
eq1b10: &eq1b10
  - "((rjr_Ms[0] >= 2700) && (rjr_Rs[0] < 0.35))"
eq1b01: &eq1b01
  - "((rjr_Ms[0] >= 2500) && (rjr_Ms[0] < 2700) && (rjr_Rs[0] >= 0.35) && (rjr_Rs[0] < 0.45))"
eq1b11: &eq1b11
  - "((rjr_Ms[0] >= 2700) && (rjr_Rs[0] >= 0.35) && (rjr_Rs[0] < 0.45))"
eq1b02: &eq1b02
  - "((rjr_Ms[0] >= 2500) && (rjr_Ms[0] < 2700) && (rjr_Rs[0] >= 0.45))"
eq1b12: &eq1b12
  - "((rjr_Ms[0] >= 2700) && (rjr_Rs[0] >= 0.45))"


################################################################################################################################################################################################################################################################################################
############### PHOTON REGIONS ###############
################################################################################################################################################################################################################################################################################################
noSV: &noSV
  - "(passNSVEq0Selection == 1)"

Ch5CRgeq1PhoBHEarly: &Ch5CRgeq1PhoBHEarly
  - "(passNPhoGe1SelectionEarlyBeamHaloCR == 1)"
  #- "(nBaseLinePhotons > 0)"
  ## >= 1 BH photon early
  #- "( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] >= 0.917252 && baseLinePhoton_WTimeSig[0] < -2.5) || ( nBaseLinePhotons == 2 && ((baseLinePhoton_beamHaloCNNScore[0] >= 0.917252 && baseLinePhoton_WTimeSig[0] < -2.5) || (baseLinePhoton_beamHaloCNNScore[1] >= 0.917252 && baseLinePhoton_WTimeSig[1] < -2.5)) ) )"

Ch6CRgeq1PhoBHLate: &Ch6CRgeq1PhoBHLate
  - "(passNPhoGe1SelectionLateBeamHaloCR == 1)"
  #- "(nBaseLinePhotons > 0)"
  ## >= 1 BH photon late
  #- "(nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] >= 0.917252 && baseLinePhoton_WTimeSig[0] >= 2.5) || ( nBaseLinePhotons == 2 && ((baseLinePhoton_beamHaloCNNScore[0] >= 0.917252 && baseLinePhoton_WTimeSig[0] >= 2.5) || (baseLinePhoton_beamHaloCNNScore[1] >= 0.917252 && baseLinePhoton_WTimeSig[1] >= 2.5)) )"

# ==0 BH photons
# >= 1 notBH photons
# >= 1 nonprompt
Ch7CRgeq1PhoNotBHEarly: &Ch7CRgeq1PhoNotBHEarly
  - "(passNPhoGe1SelectionEarlyNotBHCR == 1)"
  #- "(nBaseLinePhotons > 0)"
  ## == 0 BH photons
  #- "(( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252) || (nBaseLinePhotons == 2 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252 && baseLinePhoton_beamHaloCNNScore[1] < 0.917252) ) )"
  ## >=1 notBH photons early
  #- "( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] < 0.185 && baseLinePhoton_WTimeSig[0] < -2.5) || ( nBaseLinePhotons == 2 && ((baseLinePhoton_beamHaloCNNScore[0] < 0.185 && baseLinePhoton_WTimeSig[0] < -2.5) || (baseLinePhoton_beamHaloCNNScore[1] < 0.185 && baseLinePhoton_WTimeSig[1] < -2.5)) ) )"

Ch8SRgeq1PhoNotBHLate: &Ch8SRgeq1PhoNotBHLate
  - "(passNPhoGe1SelectionLateNotBHTightIsoSR == 1)"
  #- "(nBaseLinePhotons > 0)"
  ## == 0 BH photons
  #- "(( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252) || (nBaseLinePhotons == 2 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252 && baseLinePhoton_beamHaloCNNScore[1] < 0.917252) ) )"
  ## >=1 notBH photons late
  #- "( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] < 0.185 && baseLinePhoton_WTimeSig[0] >= 2.5) || ( nBaseLinePhotons == 2 && ((baseLinePhoton_beamHaloCNNScore[0] < 0.185 && baseLinePhoton_WTimeSig[0] >= 2.5) || (baseLinePhoton_beamHaloCNNScore[1] < 0.185 && baseLinePhoton_WTimeSig[1] >= 2.5)) ) )"

CRgeq1PhoMedIsoEarly: &Ch15CRgeq1PhoMedIsoEarly
  - "(passNPhoGe1SelectionEarlyMedIsoCR == 1)"

CRgeq1PhoMedIsoLate: &Ch16CRgeq1PhoMedIsoLate
  - "(passNPhoGe1SelectionLateMedIsoCR == 1)"

CRgeq1PhoTightIsoEarly: &Ch17CRgeq1PhoTightIsoEarly
  - "(passNPhoGe1SelectionEarlyTightIsoCR == 1)"

######################
####prompt regions####
######################
noBHPhotons: &noBHPhotons
  - "(nblBHPhotons == 0)"
  #- "(( (nBaseLinePhotons == 1 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252) || (nBaseLinePhotons == 2 && baseLinePhoton_beamHaloCNNScore[0] < 0.917252 && baseLinePhoton_beamHaloCNNScore[1] < 0.917252) ) )"

noNonPromptPhotons: &noNonPromptPhotons
  - "(nblNonpromptPhotons == 0)"
  #- "((nBaseLinePhotons == 0) || (nBaseLinePhotons == 1 && (baseLinePhoton_WTimeSig[0] < 2.5 && baseLinePhoton_WTimeSig[0] > -2.5)) || (nBaseLinePhotons == 2 && ( baseLinePhoton_WTimeSig[0] < 2.5 && baseLinePhoton_WTimeSig[0] > -2.5) && ( baseLinePhoton_WTimeSig[1] < 2.5 && baseLinePhoton_WTimeSig[1] > -2.5)) )"

geq1NonPromptPhotons: &geq1NonPromptPhotons
  - "(nblNonpromptPhotons > 0)"
  #- "( (nBaseLinePhotons == 1 && ((baseLinePhoton_WTimeSig[0] > 2.5) || (baseLinePhoton_WTimeSig[0] < -2.5))) || (nBaseLinePhotons == 2 && ( (baseLinePhoton_WTimeSig[0] > 2.5) || (baseLinePhoton_WTimeSig[0] < -2.5) || ( (baseLinePhoton_WTimeSig[1] > 2.5) || (baseLinePhoton_WTimeSig[1] < -2.5)))))"

Ch10SReq1PhoTightIsoPrompt: &Ch10SReq1PhoTightIsoPrompt
  - "(passNPhoEq1SelectionPromptTightIsoSR == 1)"
  #below true SR line, but above intermediate line in pt-iso score plane
  #- "(nBaseLinePhotons == 1 && (baseLinePhoton_Pt[0] > 100 && (baseLinePhoton_isoANNScore[0] >= -0.000198*baseLinePhoton_Pt[0] + 1.0188)) || (baseLinePhoton_Pt[0] <= 100 && (baseLinePhoton_isoANNScore[0] >= 0.999)) && (baseLinePhoton_Eta[0] < 1.479 && baseLinePhoton_Eta[0] > -1.479))"

Ch9CReq1PhoMedIsoPrompt: &Ch9CReq1PhoMedIsoPrompt
  - "(passNPhoEq1SelectionPromptMedIsoCR == 1)"
  #- "(nBaseLinePhotons == 1  && ((baseLinePhoton_Pt[0] > 100 && (baseLinePhoton_isoANNScore[0] < -0.000198*baseLinePhoton_Pt[0] + 1.0188) && ( baseLinePhoton_isoANNScore[0] >= -0.000198*baseLinePhoton_Pt[0] + 0.7698)) || (baseLinePhoton_Pt[0] <= 100 && (baseLinePhoton_isoANNScore[0] < 0.999) && (baseLinePhoton_isoANNScore[0] >= 0.75)) && (baseLinePhoton_Eta[0] < 1.479 && baseLinePhoton_Eta[0] > -1.479)))"

Ch12SReq2PhoTightIsoPrompt: &Ch12SReq2PhoTightIsoPrompt
  - "(passNPhoEq2SelectionPromptTightIsoSR == 1)"
  #- "(nBaseLinePhotons == 2 && (((baseLinePhoton_Pt[0] > 100 && (baseLinePhoton_isoANNScore[0] >= -0.0001*baseLinePhoton_Pt[0] + 0.96)) || (baseLinePhoton_Pt[0] <= 100 && (baseLinePhoton_isoANNScore[0] >= 0.95))) && (baseLinePhoton_Eta[0] < 1.479 && baseLinePhoton_Eta[0] > -1.479)) && ((baseLinePhoton_Pt[1] > 100 && (baseLinePhoton_isoANNScore[1] >= -0.0001*baseLinePhoton_Pt[1] + 0.96)) || (baseLinePhoton_Pt[1] <= 100 && baseLinePhoton_isoANNScore[1] >= 0.95) && (baseLinePhoton_Eta[1] < 1.479 && baseLinePhoton_Eta[1] > -1.479)))"

Ch11CReq2PhoMedIsoPrompt: &Ch11CReq2PhoMedIsoPrompt
  - "(passNPhoEq2SelectionPromptMedIsoCR == 1)"
  #- "(nBaseLinePhotons == 2 && ((baseLinePhoton_Pt[0] > 100 && ( baseLinePhoton_isoANNScore[0] < -0.0001*baseLinePhoton_Pt[0] + 0.96 ) && (baseLinePhoton_isoANNScore[0] >= -0.0001*baseLinePhoton_Pt[0] + 0.76 )) || (baseLinePhoton_Pt[0] <= 100 && (baseLinePhoton_isoANNScore[0] < 0.95 && baseLinePhoton_isoANNScore[0] >= 0.75)) && (baseLinePhoton_Eta[0] < 1.479 && baseLinePhoton_Eta[0] > -1.479 )) || ((baseLinePhoton_Pt[1] > 100 && (baseLinePhoton_isoANNScore[1] < -0.0001*baseLinePhoton_Pt[1] + 0.96) && ( (baseLinePhoton_isoANNScore[1] >= -0.0001*baseLinePhoton_Pt[1] + 0.76))) || (baseLinePhoton_Pt[1] <= 100 && baseLinePhoton_isoANNScore[1] < 0.95 && baseLinePhoton_isoANNScore[1] >= 0.75) && (baseLinePhoton_Eta[1] < 1.479 && baseLinePhoton_Eta[1] > -1.479 )) )"


balRJRJets: &balRJRJets
  - "( ( rjrNJetsJa[0] >= 3 && rjrNJetsJb[0] >= 2 ) || ( rjrNJetsJa[0] >= 2 && rjrNJetsJb[0] >= 3 ) )"

geq1LateSignalPhotons: &geq1LateSignalPhotons
  - "(passNPhoGe1SelectionLateSignal == 1)"
  #- "(nBaseLinePhotons > 0)"
  #- "((nBaseLinePhotons == 1 && (baseLinePhoton_WTimeSig[0] > 2.5 && baseLinePhoton_beamHaloCNNScore[0] < 0.185)) || (nBaseLinePhotons == 2 && ( baseLinePhoton_WTimeSig[0] > 2.5 && baseLinePhoton_beamHaloCNNScore[0] < 0.185) || ( baseLinePhoton_WTimeSig[1] > 2.5 && baseLinePhoton_beamHaloCNNScore[1] < 0.185)) )"


bins:
  # ==== Ch1: Ge1Lep anchor (CR, dxySig < 200) ====
  Ch1CRGeLep100:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_CR
      - *bLep00
  Ch1CRGeLep110:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_CR
      - *bLep10
  Ch1CRGeLep101:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_CR
      - *bLep01
  Ch1CRGeLep111:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_CR
      - *bLep11
  # ==== Ch2: Ge1Lep SR (dxySig > 200) ====
  # Ch2CRGeLep100 is the normalization anchor bin (lowest sensitivity, same SR selection)
  Ch2CRGeLep100:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_SR
      - *bLep00
  Ch2SRGeLep110:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_SR
      - *bLep10
  Ch2SRGeLep101:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_SR
      - *bLep01
  Ch2SRGeLep111:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeLep1_SR
      - *bLep11
  # ==== Ch3: Ge1Had anchor (CR, dxySig < 800) ====
  Ch3CRGeHad100:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_CR
      - *noNonPromptPhotons
      - *bHad00
  Ch3CRGeHad110:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_CR
      - *noNonPromptPhotons
      - *bHad10
  Ch3CRGeHad101:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_CR
      - *noNonPromptPhotons
      - *bHad01
  Ch3CRGeHad111:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_CR
      - *noNonPromptPhotons
      - *bHad11
  Ch3CRGeHad121:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_CR
      - *noNonPromptPhotons
      - *bHad21
  # ==== Ch4: Ge1Had SR (dxySig > 800) ====
  # Ch4CRGeHad100 is the normalization anchor bin (lowest sensitivity, same SR selection)
  Ch4CRGeHad100:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_SR
      - *noNonPromptPhotons
      - *bHad00
  Ch4SRGeHad110:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_SR
      - *noNonPromptPhotons
      - *bHad10
  Ch4SRGeHad101:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_SR
      - *noNonPromptPhotons
      - *bHad01
  Ch4SRGeHad111:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *SVgeHad1_SR
      - *noNonPromptPhotons
      - *bHad11
  Ch4SRGeHad121:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noNonPromptPhotons
      - *kin
      - *SVgeHad1_SR
      - *bHad21
  # ==== Ch5: Ge1 Photon Early BH CR ====
  Ch5CRgeq1PhoBHEarly00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch5CRgeq1PhoBHEarly
      - *DelayedBin00
  Ch5CRgeq1PhoBHEarly10:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch5CRgeq1PhoBHEarly
      - *DelayedBin10
  Ch5CRgeq1PhoBHEarly01:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch5CRgeq1PhoBHEarly
      - *DelayedBin01
  Ch5CRgeq1PhoBHEarly11:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch5CRgeq1PhoBHEarly
      - *DelayedBin11
  # ==== Ch6: Ge1 Photon Late BH CR ====
  Ch6CRgeq1PhoBHLate00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch6CRgeq1PhoBHLate
      - *DelayedBin00
  Ch6CRgeq1PhoBHLate10:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch6CRgeq1PhoBHLate
      - *DelayedBin10
  Ch6CRgeq1PhoBHLate01:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch6CRgeq1PhoBHLate
      - *DelayedBin01
  Ch6CRgeq1PhoBHLate11:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch6CRgeq1PhoBHLate
      - *DelayedBin11
  # ==== Ch7: Ge1 Photon Early !BH CR ====
  Ch7CRgeq1PhoNotBHEarly00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch7CRgeq1PhoNotBHEarly
      - *DelayedBin00
  Ch7CRgeq1PhoNotBHEarly10:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch7CRgeq1PhoNotBHEarly
      - *DelayedBin10
  Ch7CRgeq1PhoNotBHEarly01:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch7CRgeq1PhoNotBHEarly
      - *DelayedBin01
  Ch7CRgeq1PhoNotBHEarly11:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch7CRgeq1PhoNotBHEarly
      - *DelayedBin11
  # ==== Ch8: Ge1 Photon Late !BH SR ====
  Ch8SRgeq1PhoNotBHLateTightIso00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch8SRgeq1PhoNotBHLate
      - *DelayedBin00
  Ch8SRgeq1PhoNotBHLateTightIso10:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch8SRgeq1PhoNotBHLate
      - *DelayedBin10
  Ch8SRgeq1PhoNotBHLateTightIso01:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch8SRgeq1PhoNotBHLate
      - *DelayedBin01
  Ch8SRgeq1PhoNotBHLateTightIso11:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kin
      - *noSV
      - *Ch8SRgeq1PhoNotBHLate
      - *DelayedBin11
  # ==== Ch9: Eq1 Photon Prompt CR ====
  Ch9CReq1PhoMedIsoPrompt00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
      - *balRJRJets
      - *kin
      - *noBHPhotons
      - *noNonPromptPhotons
      - *Ch9CReq1PhoMedIsoPrompt
      - *eq1b00
  Ch9CReq1PhoMedIsoPrompt10:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
      - *balRJRJets
      - *kin
      - *noBHPhotons
      - *noNonPromptPhotons
      - *Ch9CReq1PhoMedIsoPrompt
      - *eq1b10
  Ch9CReq1PhoMedIsoPrompt01:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
      - *kin
      - *balRJRJets
      - *noBHPhotons
      - *noNonPromptPhotons
      - *Ch9CReq1PhoMedIsoPrompt
      - *eq1b01
  Ch9CReq1PhoMedIsoPrompt02:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
      - *balRJRJets
      - *kin
      - *noBHPhotons
      - *noNonPromptPhotons
      - *Ch9CReq1PhoMedIsoPrompt
      - *eq1b02
  Ch9CReq1PhoMedIsoPrompt11:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
      - *kin
      - *balRJRJets
      - *noBHPhotons
      - *noNonPromptPhotons
      - *Ch9CReq1PhoMedIsoPrompt
      - *eq1b11
  Ch9CReq1PhoMedIsoPrompt12:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *noSV
